<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EAE Iframe Spike</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #controls { padding: 10px; background: #eee; border-bottom: 1px solid #ccc; display: flex; gap: 10px; }
    iframe { width: 100%; height: calc(100% - 50px); border: none; }
  </style>
</head>
<body>
  <div id="controls">
    <input type="text" id="geoId" placeholder="Geography ID">
    <input type="text" id="snapshot" placeholder="Snapshot ID (optional)">
    <input type="text" id="datasets" placeholder="Dataset names (comma-separated)">
    <button id="loadBtn">Load</button>
  </div>
  <iframe id="eaeFrame" title="Energy Access Explorer"></iframe>

  <script>
    document.getElementById('loadBtn').addEventListener('click', () => {
      const geoId = document.getElementById('geoId').value.trim();
      const snapshot = document.getElementById('snapshot').value.trim();
      const datasets = document.getElementById('datasets').value.trim();
      
      const params = new URLSearchParams();
      if (geoId) params.append('id', geoId);
      if (snapshot) params.append('snapshot', snapshot);
      if (datasets) params.append('inputs', datasets);
      
      const url = "https://www.energyaccessexplorer.org/tool/a/?" + params.toString();
      document.getElementById('eaeFrame').src = url;
      console.log("Loading URL:", url);
    });
  </script>
</body>
</html>
