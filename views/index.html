<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EAE map wrapper</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <!-- Your existing stylesheet (views/ -> ../stylesheets/).
         To make this a truly single file, paste its content inside a <style> tag instead. -->
    <link rel="stylesheet" href="../stylesheets/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="main">
        <!-- LEFT: brand header + category rail + dataset panel -->
        <div id="side">
          <header id="brand">
            <h1 id="title">Select a country</h1>
            <button id="about-btn" type="button" aria-label="About this map">
              i
            </button>
          </header>

          <div id="side-body">
            <nav id="rail" aria-label="Dataset categories">
              <button type="button" class="rail-item" data-cat="census">
                Census
              </button>
              <button type="button" class="rail-item" data-cat="demand">
                Demand
              </button>
              <button type="button" class="rail-item" data-cat="supply">
                Supply
              </button>
              <button type="button" class="rail-item" data-cat="other">
                Other
              </button>
              <button type="button" class="rail-item active" data-cat="all">
                All
              </button>
            </nav>

            <aside id="panel">
              <section id="area" aria-label="Choose an area">
                <label
                  >Country
                  <select id="country">
                    <option value="">Loading...</option>
                  </select>
                </label>
                <label
                  >State
                  <select id="state" disabled>
                    <option value="">Select a country first</option>
                  </select>
                </label>
                <label
                  >District
                  <select id="district" disabled>
                    <option value="">Select a state first</option>
                  </select>
                </label>
                <label
                  >Crop
                  <select id="crop">
                    <option value="">Select a crop</option>
                  </select>
                </label>
                <div id="info" role="status" aria-live="polite"></div>
              </section>

              <h2 id="panel-title">All</h2>
              <ul id="datasets"></ul>
            </aside>
          </div>
        </div>

        <!-- CENTRE: tabs + map -->
        <main id="stage">
          <button id="menu-btn" type="button" aria-label="Open menu">
            &#9776;
          </button>
          <div id="tabs" role="tablist">
            <button type="button" class="tab active" role="tab" data-tab="data">
              DATA
            </button>
            <button type="button" class="tab" role="tab" data-tab="analysis">
              ANALYSIS
            </button>
          </div>
          <div id="map"></div>
        </main>

        <!-- RIGHT: legend / analysis, preview of the selected place -->
        <aside id="results" aria-label="Results">
          <div id="results-head"><span id="results-title">Legend</span></div>
          <div id="results-body"></div>

          <section id="preview" aria-label="Selected place preview">
            <div id="preview-head">
              <span id="preview-label">No place selected</span>
            </div>
            <div id="preview-map">
              <div id="minimap"></div>
              <div id="preview-empty">
                Select a country to see a preview of the place
              </div>
            </div>
            <div id="preview-credit">&copy; OpenStreetMap contributors</div>
          </section>

          <div id="results-foot">
            <button type="button" id="help-btn">Help</button>
            <button type="button" id="disclaimer-btn">Disclaimer</button>
          </div>
        </aside>
      </div>

      <footer id="footer">
        <span>Wrapper for Energy Access Explorer data</span>
      </footer>
    </div>

    <!-- Three-dot menu (filled by the script below) -->
    <div id="ds-menu" role="menu" hidden></div>

    <!-- Dataset info -->
    <dialog id="info-dialog" aria-labelledby="info-title">
      <header class="info-head">
        <h3 id="info-title"></h3>
        <button type="button" id="info-close" aria-label="Close">
          &times;
        </button>
      </header>
      <div id="info-body"></div>
    </dialog>

    <!-- Set values manually -->
    <dialog id="values-dialog" aria-labelledby="values-title">
      <h3 id="values-title"></h3>
      <div class="values-grid">
        <label
          >Color
          <span class="values-color-row">
            <input type="color" id="values-color" />
            <input
              type="text"
              id="values-hex"
              maxlength="7"
              placeholder="#e6194b"
            />
          </span>
        </label>
        <label
          >Opacity (0-100)
          <input type="number" id="values-opacity" min="0" max="100" step="5" />
        </label>
      </div>
      <p id="values-error" class="values-error" role="alert"></p>
      <div class="values-actions">
        <button type="button" id="values-cancel" class="ghost">Cancel</button>
        <button type="button" id="values-apply">Apply</button>
      </div>
    </dialog>

    <!-- Help / Disclaimer -->
    <dialog id="dialog">
      <h3 id="dialog-title"></h3>
      <p id="dialog-text"></p>
      <button type="button" id="dialog-close">Close</button>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
      /* =====================================================================
   config.js
   ===================================================================== */
      const API = "https://api.energyaccessexplorer.org";

      // Dataset types the map knows how to draw.
      const DRAWABLE = ["points", "lines", "polygons", "polygons-boundaries"];

      const COLORS = [
        "#e6194b",
        "#3cb44b",
        "#4363d8",
        "#f58231",
        "#911eb4",
        "#008080",
        "#f032e6",
        "#9a6324",
        "#800000",
        "#000075",
      ];

      const DEFAULT_OPACITY = 0.25;
      const MAP_DEFAULT = { center: [20, 0], zoom: 2 };

      const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
      const TILE_ATTRIBUTION = "&copy; OpenStreetMap contributors";

      const POPUP_MAX_ROWS = 12;
      const TOOLTIP_MAX_ROWS = 6;

      const CATEGORIES = [
        {
          id: "census",
          label: "Census",
          match:
            /census|population|household|roof|radio|lighting|cooking|literacy|ownership/i,
        },
        {
          id: "demand",
          label: "Demand",
          match:
            /demand|crop|agri|health|school|education|market|business|income|poverty|night/i,
        },
        {
          id: "supply",
          label: "Supply",
          match:
            /supply|solar|wind|hydro|geothermal|biomass|power|grid|transmission|substation|line|road|mini|ghi|elevation|slope/i,
        },
        { id: "other", label: "Other", match: null },
        { id: "all", label: "All", match: null },
      ];
      const DEFAULT_CATEGORY = "all";

      const INFO_FIELDS = {
        description: ["description_long", "description", "about"],
        why: ["why", "why_used", "purpose", "usage"],
        citation: ["citation", "suggested_citation", "cite"],
        cautions: ["cautions", "caution", "warning", "limitations"],
        source: ["sources", "source", "provider"],
        license: ["license", "licence"],
        date: ["date_of_content", "content_date", "date", "year"],
        download: [
          "download",
          "download_url",
          "download_from_source",
          "source_url",
        ],
        learn: ["learn_more", "learn_more_url", "more_info", "url", "link"],
      };

      // Only works when served by server.py on localhost. On a real host the
      // page falls back to a direct request (the data host must allow CORS).
      const USE_PROXY = ["localhost", "127.0.0.1"].includes(location.hostname);
      const PROXY_PATH = "/proxy?url=";

      const TEXTS = {
        help: "Pick a country, then a state and (optionally) a district. Switch on any layer in the left panel to draw it. Hover the map to see a place's details, click it for everything we know. In the Legend, click a color dot to recolor a layer. Use the three dots next to a layer for its info, advanced controls and more.",
        disclaimer:
          "This page is an independent wrapper around public Energy Access Explorer data. Boundaries and datasets are shown as provided by the source and may be incomplete or out of date.",
      };

      // Mock crop analyses. The local file is relative to this page.
      const MOCK_CROP_FILE = "../data/mock-crop.geojson";
      const CROPS = [
        { id: "maize", label: "Maize", dataset: "maize_suitability" },
        { id: "cassava", label: "Cassava", dataset: "cassava_suitability" },
        { id: "rice", label: "Rice", dataset: "rice_suitability" },
      ];

      /* =====================================================================
   data.js
   ===================================================================== */
      async function api(path, params) {
        const res = await fetch(API + path + "?" + new URLSearchParams(params));
        if (!res.ok) throw new Error("API " + res.status + " on " + path);
        return res.json();
      }

      function fetchCountries() {
        return api("/geographies", {
          select: "id,name,adm,envelope,parent_id",
          parent_id: "is.null",
          order: "name.asc",
        });
      }

      function fetchStates(countryId) {
        return api("/geographies", {
          select: "id,name,adm,envelope,parent_id",
          parent_id: "eq." + countryId,
          order: "name.asc",
        });
      }

      function fetchDatasets(geographyId) {
        return api("/datasets", {
          select: "id,name,name_long,type,source_files",
          geography_id: "eq." + geographyId,
          name_long: "not.is.null",
          order: "name_long.asc",
        });
      }

      function hasVectorFile(d) {
        return (d.source_files || []).some((f) => f.func === "vectors");
      }

      function isDrawable(d) {
        return DRAWABLE.includes(d.type) && hasVectorFile(d);
      }

      function categoryOf(d) {
        const hit = CATEGORIES.find(
          (c) => c.match && c.match.test(d.name_long || d.name || ""),
        );
        return hit ? hit.id : "other";
      }

      async function fetchGeoJSON(dataset) {
        const file = dataset.source_files.find((f) => f.func === "vectors");
        if (USE_PROXY) {
          try {
            const res = await fetch(
              PROXY_PATH + encodeURIComponent(file.endpoint),
            );
            if (res.ok) return res.json();
          } catch (e) {
            // proxy not running: fall through to a direct request
          }
        }
        const res = await fetch(file.endpoint);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }

      async function fetchDatasetInfo(id) {
        const rows = await api("/datasets", { select: "*", id: "eq." + id });
        return rows[0] || null;
      }

      const normKey = (k) =>
        String(k)
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");

      function pickField(row, names) {
        let meta = row.metadata;
        if (typeof meta === "string") {
          try {
            meta = JSON.parse(meta);
          } catch (e) {
            meta = null;
          }
        }
        const sources = [
          row,
          meta && typeof meta === "object" ? meta : null,
        ].filter(Boolean);
        for (const src of sources) {
          for (const name of names) {
            const key = Object.keys(src).find(
              (k) => normKey(k) === normKey(name),
            );
            if (!key) continue;
            const v = src[key];
            if (typeof v === "string" && v.trim()) return v.trim();
            if (typeof v === "number") return String(v);
            if (
              Array.isArray(v) &&
              v.length &&
              v.every((x) => typeof x !== "object")
            ) {
              return v.join(", ");
            }
          }
        }
        return "";
      }

      function normalizeInfo(row) {
        const out = {};
        Object.keys(INFO_FIELDS).forEach((k) => {
          out[k] = row ? pickField(row, INFO_FIELDS[k]) : "";
        });
        return out;
      }

      function findOutlineDataset(list) {
        return (
          list.find(
            (d) =>
              /^(outline|boundary|boundaries|country-?outline|geography-?outline)$/i.test(
                d.name || "",
              ) && hasVectorFile(d),
          ) ||
          list.find(
            (d) => /^outline$/i.test(d.name_long || "") && hasVectorFile(d),
          )
        );
      }

      async function fetchOutline(list) {
        const d = findOutlineDataset(list);
        return d ? fetchGeoJSON(d) : null;
      }

      function findDistrictDataset(list) {
        return (
          list.find((d) => d.name === "district-boundaries") ||
          list.find((d) => /district/i.test(d.name || "") && hasVectorFile(d))
        );
      }

      function detectNameProp(features) {
        const sample = (features.find((f) => f.properties) || {}).properties;
        const keys = Object.keys(sample || {});
        return (
          keys.find((k) => /^district(_?n(ame)?)?$/i.test(k)) ||
          keys.find((k) => /district/i.test(k)) ||
          keys.find((k) => /name/i.test(k)) ||
          null
        );
      }

      async function fetchDistricts(list) {
        const dd = findDistrictDataset(list);
        if (!dd || !hasVectorFile(dd)) return null;
        const gj = await fetchGeoJSON(dd);
        const features = gj.features || [];
        return { features, prop: detectNameProp(features) };
      }

      /* =====================================================================
   embed.js  (main Leaflet map)
   ===================================================================== */
      const map = L.map("map", {
        renderer: L.canvas({ tolerance: 6 }),
        zoomControl: false,
      }).setView(MAP_DEFAULT.center, MAP_DEFAULT.zoom);
      L.control.zoom({ position: "topright" }).addTo(map);
      L.tileLayer(TILE_URL, {
        maxZoom: 19,
        attribution: TILE_ATTRIBUTION,
      }).addTo(map);

      const active = {};
      let colorIdx = 0;
      let districtLayer = null;

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function attrRows(props, max, cut) {
        return Object.entries(props || {})
          .filter(([, v]) => v !== null && v !== "" && typeof v !== "object")
          .slice(0, max)
          .map(
            ([k, v]) =>
              "<tr><td><b>" +
              esc(k) +
              "</b></td><td>" +
              esc(String(v).slice(0, cut)) +
              "</td></tr>",
          )
          .join("");
      }

      function featureTitle(props) {
        const entries = Object.entries(props || {}).filter(
          ([, v]) => typeof v === "string" && v.trim(),
        );
        const hit =
          entries.find(([k]) => /^(name|title|label)$/i.test(k)) ||
          entries.find(([k]) => /name/i.test(k));
        return hit ? hit[1].trim() : "";
      }

      const dot = (color) =>
        '<span class="tip-dot" style="background:' + esc(color) + '"></span>';

      function popupHtml(props, name, color) {
        const title = featureTitle(props);
        const rows = attrRows(props, POPUP_MAX_ROWS, 200);
        return (
          '<div class="tip-layer">' +
          dot(color) +
          esc(name) +
          "</div>" +
          (title ? '<div class="tip-title">' + esc(title) + "</div>" : "") +
          (rows
            ? '<table class="tip-table">' + rows + "</table>"
            : "No attributes")
        );
      }

      function tipHtml(props, name, color) {
        const title = featureTitle(props);
        const rows = attrRows(props, TOOLTIP_MAX_ROWS, 60);
        return (
          '<div class="tip-layer">' +
          dot(color) +
          esc(name) +
          "</div>" +
          (title ? '<div class="tip-title">' + esc(title) + "</div>" : "") +
          (rows ? '<table class="tip-table">' + rows + "</table>" : "") +
          '<div class="tip-hint">Click for all details</div>'
        );
      }

      function fitEnvelope(env) {
        if (!Array.isArray(env) || env.length < 4) return;
        map.fitBounds([
          [env[1], env[0]],
          [env[3], env[2]],
        ]);
      }

      function clearDistrictLayer() {
        if (districtLayer) {
          map.removeLayer(districtLayer);
          districtLayer = null;
        }
      }

      function showDistrict(features) {
        clearDistrictLayer();
        districtLayer = L.geoJSON(
          { type: "FeatureCollection", features },
          {
            style: {
              color: "#000",
              weight: 3,
              fillColor: "#ffd400",
              fillOpacity: 0.15,
            },
            interactive: false,
          },
        ).addTo(map);
        map.fitBounds(districtLayer.getBounds());
      }

      let clip = null;

      function ringBBox(ring) {
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        ring.forEach(([x, y]) => {
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        });
        return [minX, minY, maxX, maxY];
      }

      function inRing(ring, x, y) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0],
            yi = ring[i][1];
          const xj = ring[j][0],
            yj = ring[j][1];
          if (
            yi > y !== yj > y &&
            x < ((xj - xi) * (y - yi)) / (yj - yi) + xi
          ) {
            inside = !inside;
          }
        }
        return inside;
      }

      function buildClip(features) {
        const polys = [];
        features.forEach((f) => {
          const g = f.geometry;
          if (!g) return;
          const list =
            g.type === "Polygon"
              ? [g.coordinates]
              : g.type === "MultiPolygon"
                ? g.coordinates
                : [];
          list.forEach((rings) =>
            polys.push({ rings, bbox: ringBBox(rings[0]) }),
          );
        });
        return polys.length ? { polys } : null;
      }

      function pointInClip(x, y) {
        return clip.polys.some((p) => {
          const b = p.bbox;
          if (x < b[0] || x > b[2] || y < b[1] || y > b[3]) return false;
          if (!inRing(p.rings[0], x, y)) return false;
          return !p.rings.slice(1).some((h) => inRing(h, x, y));
        });
      }

      function vertices(coords, out) {
        if (typeof coords[0] === "number") out.push(coords);
        else coords.forEach((c) => vertices(c, out));
        return out;
      }

      function featureInClip(f) {
        const g = f.geometry;
        if (!g) return false;
        const geoms = g.type === "GeometryCollection" ? g.geometries : [g];
        return geoms.some((gg) =>
          vertices(gg.coordinates || [], []).some(([x, y]) =>
            pointInClip(x, y),
          ),
        );
      }

      const styleOf = (color, opacity) => ({
        color: color,
        weight: 2,
        fillColor: color,
        fillOpacity: opacity,
      });

      const hoverTip = L.tooltip({
        direction: "top",
        offset: [0, -8],
        opacity: 1,
        className: "hover-tip",
      });

      function buildLayer(id, raw, color, name, opacity) {
        const all = raw.features || [];
        const feats = clip ? all.filter(featureInClip) : all;
        const layer = L.geoJSON(
          { type: "FeatureCollection", features: feats },
          {
            pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 5 }),
            style: () => styleOf(color, opacity),
            onEachFeature: (f, l) => {
              l.bindPopup(() => {
                const a = active[id];
                return popupHtml(f.properties, name, a ? a.color : color);
              });
            },
          },
        ).addTo(map);

        layer.on("mouseover", (e) => {
          const a = active[id];
          if (!a || !e.layer.feature) return;
          hoverTip
            .setLatLng(e.latlng)
            .setContent(tipHtml(e.layer.feature.properties, a.name, a.color));
          if (!map.hasLayer(hoverTip)) hoverTip.addTo(map);
          e.layer.setStyle({
            weight: 4,
            fillOpacity: Math.min(0.7, a.opacity + 0.3),
          });
        });
        layer.on("mousemove", (e) => hoverTip.setLatLng(e.latlng));
        layer.on("mouseout", (e) => {
          if (map.hasLayer(hoverTip)) map.removeLayer(hoverTip);
          const a = active[id];
          if (a) e.layer.setStyle(styleOf(a.color, a.opacity));
        });

        return { layer, shown: feats.length, total: all.length };
      }

      function addDataLayer(id, name, gj) {
        const color = COLORS[colorIdx++ % COLORS.length];
        const { layer, shown, total } = buildLayer(
          id,
          gj,
          color,
          name,
          DEFAULT_OPACITY,
        );
        active[id] = {
          layer,
          color,
          defaultColor: color,
          opacity: DEFAULT_OPACITY,
          name,
          raw: gj,
          shown,
          total,
        };
        return { shown, total };
      }

      function setLayerStyle(id, { color, opacity }) {
        const a = active[id];
        if (!a) return;
        if (color) a.color = color;
        if (opacity !== undefined && opacity !== null) a.opacity = opacity;
        a.layer.setStyle(styleOf(a.color, a.opacity));
      }

      function resetLayerStyle(id) {
        const a = active[id];
        if (a)
          setLayerStyle(id, {
            color: a.defaultColor,
            opacity: DEFAULT_OPACITY,
          });
      }

      function setClip(features) {
        clip = features && features.length ? buildClip(features) : null;
        Object.entries(active).forEach(([id, a]) => {
          map.removeLayer(a.layer);
          const b = buildLayer(id, a.raw, a.color, a.name, a.opacity);
          a.layer = b.layer;
          a.shown = b.shown;
          a.total = b.total;
        });
      }

      function zoomToLayer(id) {
        if (!active[id]) return false;
        const bounds = active[id].layer.getBounds();
        if (!bounds.isValid()) return false;
        map.fitBounds(bounds);
        return true;
      }

      function removeDataLayer(id) {
        if (!active[id]) return;
        map.removeLayer(active[id].layer);
        delete active[id];
        if (map.hasLayer(hoverTip)) map.removeLayer(hoverTip);
      }

      function clearAllLayers() {
        Object.values(active).forEach((a) => map.removeLayer(a.layer));
        Object.keys(active).forEach((k) => delete active[k]);
        colorIdx = 0;
        clip = null;
        if (map.hasLayer(hoverTip)) map.removeLayer(hoverTip);
      }

      /* =====================================================================
   preview.js  (small "selected place" map)
   ===================================================================== */
      const mini = L.map("minimap", {
        preferCanvas: true,
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        touchZoom: false,
        doubleClickZoom: false,
        scrollWheelZoom: false,
        boxZoom: false,
        keyboard: false,
      }).setView(MAP_DEFAULT.center, 1);
      L.tileLayer(TILE_URL, { maxZoom: 19 }).addTo(mini);

      const pvLabel = document.getElementById("preview-label");
      const pvEmpty = document.getElementById("preview-empty");

      const PV_STYLE = {
        color: "#007a4d",
        weight: 2,
        fillColor: "#007a4d",
        fillOpacity: 0.2,
        interactive: false,
      };
      const PV_DISTRICT_STYLE = {
        color: "#000",
        weight: 2,
        fillColor: "#ffd400",
        fillOpacity: 0.55,
        interactive: false,
      };

      let pvPlace = "";
      let pvShape = null;
      let pvDistrict = null;
      let pvBounds = null;

      function pvRemove(layer) {
        if (layer) mini.removeLayer(layer);
        return null;
      }

      function pvFit(bounds) {
        pvBounds = bounds;
        if (bounds && bounds.isValid()) {
          mini.fitBounds(bounds, { padding: [10, 10], animate: false });
        }
      }

      function pvSetLabel(text) {
        pvLabel.textContent = text || "No place selected";
        pvEmpty.hidden = !!pvPlace;
      }

      function previewPlace(name, envelope) {
        pvDistrict = pvRemove(pvDistrict);
        pvShape = pvRemove(pvShape);
        pvPlace = name || "";
        pvBounds = null;
        if (Array.isArray(envelope) && envelope.length >= 4) {
          const b = L.latLngBounds(
            [envelope[1], envelope[0]],
            [envelope[3], envelope[2]],
          );
          pvShape = L.rectangle(b, PV_STYLE).addTo(mini);
          pvFit(b);
        }
        pvSetLabel(pvPlace);
      }

      function previewOutline(gj) {
        if (!pvPlace) return;
        pvShape = pvRemove(pvShape);
        pvShape = L.geoJSON(gj, {
          style: () => PV_STYLE,
          interactive: false,
        }).addTo(mini);
        if (!pvDistrict) pvFit(pvShape.getBounds());
      }

      function previewDistrict(features, name) {
        pvDistrict = pvRemove(pvDistrict);
        if (!features || !features.length) {
          if (pvShape) pvFit(pvShape.getBounds());
          pvSetLabel(pvPlace);
          return;
        }
        pvDistrict = L.geoJSON(
          { type: "FeatureCollection", features },
          { style: () => PV_DISTRICT_STYLE, interactive: false },
        ).addTo(mini);
        pvFit(pvDistrict.getBounds());
        pvSetLabel(pvPlace + " / " + name);
      }

      function previewReset() {
        pvDistrict = pvRemove(pvDistrict);
        pvShape = pvRemove(pvShape);
        pvPlace = "";
        pvBounds = null;
        mini.setView(MAP_DEFAULT.center, 1);
        pvSetLabel("");
      }

      function previewResize() {
        mini.invalidateSize();
        if (pvBounds) pvFit(pvBounds);
      }

      /* =====================================================================
   main.js  (dropdowns, rail, toggles, legend, dialogs)
   ===================================================================== */
      const $ = (id) => document.getElementById(id);

      const countrySel = $("country");
      const stateSel = $("state");
      const districtSel = $("district");
      const cropSel = $("crop"); // CHANGED: declared at the top so syncUrl can read it
      const info = $("info");
      const titleEl = $("title");
      const datasetList = $("datasets");
      const panelTitle = $("panel-title");
      const resultsTitle = $("results-title");
      const resultsBody = $("results-body");
      const side = $("side");
      const menuEl = $("ds-menu");

      const say = (t) => (info.textContent = t);

      let countries = [];
      let states = [];
      let datasets = [];
      let districtFeatures = [];
      let districtProp = null;
      let selToken = 0;
      let category = DEFAULT_CATEGORY;
      let tab = "data";
      let menuDatasetId = null;
      const loadingIds = new Set();
      const advOpen = new Set();

      // URL state: ?country=<id>&state=<id>&district=<name>&crop=<id>&layers=<id>,<id>
      const initialParams = new URLSearchParams(location.search);
      let restoring = initialParams.has("country");

      const hexOf = (c) => (/^#[0-9a-f]{6}$/i.test(c) ? c : "#888888");
      const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "");

      function fill(select, items, placeholder) {
        select.innerHTML =
          '<option value="">' +
          esc(placeholder) +
          "</option>" +
          items
            .map(
              (i) =>
                '<option value="' +
                esc(i.value) +
                '"' +
                (i.disabled ? " disabled" : "") +
                ">" +
                esc(i.label) +
                "</option>",
            )
            .join("");
        select.disabled = items.length === 0;
      }

      function setTitle(name) {
        titleEl.textContent = name || "Select a country";
      }

      function clearDistrict() {
        clearDistrictLayer();
        districtFeatures = [];
        districtProp = null;
      }

      function resetLayers() {
        clearAllLayers();
        advOpen.clear();
        closeMenu();
        if (cropSel) cropSel.value = ""; // CHANGED: crop layer is gone, so reset its dropdown
      }

      // ---- URL state ---------------------------------------------------------
      function syncUrl() {
        if (restoring) return;
        const p = new URLSearchParams();
        if (countrySel.value) p.set("country", countrySel.value);
        if (stateSel.value) p.set("state", stateSel.value);
        if (districtSel.value) p.set("district", districtSel.value);
        if (cropSel && cropSel.value) p.set("crop", cropSel.value); // CHANGED
        // CHANGED: mock crop layers are restored through ?crop=, not ?layers=
        const ids = Object.keys(active).filter(
          (id) => !String(id).startsWith("mock_"),
        );
        if (ids.length) p.set("layers", ids.join(","));
        const q = p.toString();
        history.replaceState(null, "", location.pathname + (q ? "?" + q : ""));
      }

      // ---- Left panel: dataset list -------------------------------------------
      function advHtml(id) {
        const a = active[id];
        const pct = Math.round(a.opacity * 100);
        return (
          '<div class="adv">' +
          '<div class="adv-line"><span>Color</span>' +
          '<input type="color" class="adv-color" value="' +
          hexOf(a.color) +
          '" /></div>' +
          '<div class="adv-presets">' +
          COLORS.map(
            (c) =>
              '<button type="button" class="preset" data-color="' +
              c +
              '" style="background:' +
              c +
              '" aria-label="Use ' +
              c +
              '"></button>',
          ).join("") +
          "</div>" +
          '<div class="adv-line"><span>Opacity</span>' +
          '<input type="range" class="adv-op" min="0" max="100" value="' +
          pct +
          '" />' +
          "<output>" +
          pct +
          "%</output></div>" +
          "</div>"
        );
      }

      function renderDatasets() {
        const cat = CATEGORIES.find((c) => c.id === category);
        panelTitle.textContent = cat ? cat.label : "";
        datasetList.innerHTML = "";

        if (!datasets.length) {
          datasetList.innerHTML =
            '<li class="empty">Select a state to see its layers.</li>';
          return;
        }

        const shown = datasets.filter(
          (d) => category === "all" || categoryOf(d) === category,
        );
        if (!shown.length) {
          datasetList.innerHTML =
            '<li class="empty">No layers in this category.</li>';
          return;
        }

        shown.forEach((d) => {
          const ok = isDrawable(d);
          const on = !!active[d.id];
          const li = document.createElement("li");
          li.className =
            "ds" +
            (ok ? "" : " disabled") +
            (loadingIds.has(d.id) ? " loading" : "");
          if (!ok) li.title = d.type + " - not drawable";
          li.innerHTML =
            '<div class="ds-row">' +
            '<label class="switch"><input type="checkbox"' +
            (on ? " checked" : "") +
            (ok ? "" : " disabled") +
            ' aria-label="' +
            esc(d.name_long) +
            '" />' +
            '<span class="track"></span></label>' +
            '<span class="ds-name">' +
            esc(d.name_long) +
            "</span>" +
            '<button type="button" class="ds-menu" title="More options" aria-label="More options" aria-haspopup="menu">&#8942;</button>' +
            "</div>" +
            (on && advOpen.has(d.id) ? advHtml(d.id) : "");

          li.querySelector("input").addEventListener("change", (e) =>
            toggleLayer(d, e.target),
          );
          li.querySelector(".ds-menu").addEventListener("click", (e) =>
            toggleMenu(d, e.currentTarget),
          );

          const adv = li.querySelector(".adv");
          if (adv) {
            adv.querySelector(".adv-color").addEventListener("input", (e) => {
              setLayerStyle(d.id, { color: e.target.value });
              renderResults();
            });
            adv.querySelectorAll(".preset").forEach((b) =>
              b.addEventListener("click", () => {
                setLayerStyle(d.id, { color: b.dataset.color });
                refresh();
              }),
            );
            const op = adv.querySelector(".adv-op");
            const out = adv.querySelector("output");
            op.addEventListener("input", () => {
              out.textContent = op.value + "%";
              setLayerStyle(d.id, { opacity: op.value / 100 });
            });
          }
          datasetList.appendChild(li);
        });
      }

      // ---- Right panel -------------------------------------------------------
      function renderResults() {
        resultsTitle.textContent = tab === "data" ? "Legend" : "Analysis";
        resultsBody.innerHTML = "";

        const ids = Object.keys(active);
        if (!ids.length) {
          resultsBody.innerHTML =
            '<div class="empty">No layers on the map yet.</div>';
          return;
        }

        if (tab === "data") {
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.textContent = "Click a color dot to change that layer's color.";
          resultsBody.appendChild(hint);
        }

        ids.forEach((id) => {
          const a = active[id];
          const row = document.createElement("div");
          row.className = "row";
          if (tab === "data") {
            row.innerHTML =
              '<input type="color" class="lg-color" title="Change color" aria-label="Change color of ' +
              esc(a.name) +
              '" value="' +
              hexOf(a.color) +
              '" />' +
              '<span class="t">' +
              esc(a.name) +
              "</span>" +
              '<button type="button" title="Remove" aria-label="Remove layer">&times;</button>';
            const color = row.querySelector(".lg-color");
            color.addEventListener("input", (e) =>
              setLayerStyle(id, { color: e.target.value }),
            );
            color.addEventListener("change", () => renderDatasets());
            row.querySelector("button").onclick = () => {
              removeDataLayer(id);
              advOpen.delete(id);
              // CHANGED: removing a crop layer also clears the crop dropdown
              if (String(id).startsWith("mock_") && cropSel) cropSel.value = "";
              refresh();
            };
          } else {
            row.innerHTML =
              '<div class="sw" style="background:' +
              esc(a.color) +
              '"></div>' +
              '<span class="t">' +
              esc(a.name) +
              "</span>" +
              '<span class="count">' +
              (a.shown === a.total ? a.shown : a.shown + " of " + a.total) +
              " features</span>";
          }
          resultsBody.appendChild(row);
        });
      }

      function refresh() {
        renderDatasets();
        renderResults();
        syncUrl();
      }

      // ---- Three-dot menu ----------------------------------------------------
      function closeMenu() {
        menuEl.hidden = true;
        menuDatasetId = null;
      }

      function toggleMenu(d, btn) {
        if (!menuEl.hidden && menuDatasetId === d.id) {
          closeMenu();
          return;
        }
        const on = !!active[d.id];
        const items = [
          { label: "Dataset info", run: () => openInfo(d) },
          {
            label: "Toggle advanced controls",
            needsOn: true,
            run: () => {
              if (advOpen.has(d.id)) advOpen.delete(d.id);
              else advOpen.add(d.id);
              renderDatasets();
            },
          },
          {
            label: "Reset default values",
            needsOn: true,
            run: () => {
              resetLayerStyle(d.id);
              refresh();
              say(d.name_long + ": default color and opacity restored");
            },
          },
          {
            label: "Set values manually",
            needsOn: true,
            run: () => openValues(d),
          },
          {
            label: "Zoom to layer",
            needsOn: true,
            run: () => {
              if (!zoomToLayer(d.id)) say("Nothing to zoom to in this layer.");
            },
          },
        ];

        menuEl.innerHTML = items
          .map(
            (it, i) =>
              '<button type="button" role="menuitem" data-i="' +
              i +
              '"' +
              (it.needsOn && !on
                ? ' disabled title="Switch the layer on first"'
                : "") +
              ">" +
              esc(it.label) +
              "</button>",
          )
          .join("");
        menuEl.querySelectorAll("button").forEach((b) =>
          b.addEventListener("click", () => {
            const it = items[Number(b.dataset.i)];
            closeMenu();
            it.run();
          }),
        );

        menuDatasetId = d.id;
        menuEl.hidden = false;
        const r = btn.getBoundingClientRect();
        menuEl.style.top =
          Math.max(
            8,
            Math.min(r.bottom, window.innerHeight - menuEl.offsetHeight - 8),
          ) + "px";
        menuEl.style.left = Math.max(8, r.right - menuEl.offsetWidth) + "px";
      }

      document.addEventListener("click", (e) => {
        if (
          !menuEl.hidden &&
          !menuEl.contains(e.target) &&
          !e.target.closest(".ds-menu")
        ) {
          closeMenu();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
      $("panel").addEventListener("scroll", closeMenu);
      window.addEventListener("resize", closeMenu);

      // ---- "Dataset info" window --------------------------------------------
      const infoDialog = $("info-dialog");
      const infoTitle = $("info-title");
      const infoBody = $("info-body");
      let infoToken = 0;

      function infoHtml(i, d, note) {
        const para = (t) => "<p>" + esc(t).replace(/\n/g, "<br>") + "</p>";
        const sec = (h, t) => (t ? "<h4>" + esc(h) + "</h4>" + para(t) : "");
        const link = (label, u) => {
          const s = safeUrl(u);
          return s
            ? '<div class="info-link"><a href="' +
                esc(s) +
                '" target="_blank" rel="noopener noreferrer">' +
                esc(label) +
                " &#8600;</a></div>"
            : "";
        };

        const left =
          sec("Description", i.description) +
          sec("Why is this dataset used?", i.why) +
          sec("Suggested Citation", i.citation) +
          sec("Cautions", i.cautions);
        const right =
          link("Download from Source", i.download) +
          link("Learn More", i.learn) +
          sec("Sources", i.source) +
          sec("License", i.license) +
          sec("Date of Content", i.date) +
          sec("Type", d.type);

        return (
          (note ? '<p class="muted info-note">' + esc(note) + "</p>" : "") +
          '<div class="info-cols"><div>' +
          (left ||
            '<p class="muted">No description is available for this dataset.</p>') +
          "</div><div>" +
          right +
          "</div></div>"
        );
      }

      async function openInfo(d) {
        const token = ++infoToken;
        infoTitle.textContent = d.name_long || d.name;
        infoBody.innerHTML =
          '<p class="muted">Loading dataset information...</p>';
        if (!infoDialog.open) infoDialog.showModal();

        let html;
        try {
          const row = await fetchDatasetInfo(d.id);
          if (token !== infoToken) return;
          html = infoHtml(normalizeInfo(row), d);
        } catch (e) {
          console.error(e);
          if (token !== infoToken) return;
          html = infoHtml(
            normalizeInfo(null),
            d,
            "Could not load the full description: " + e.message,
          );
        }
        infoBody.innerHTML = html;
      }

      $("info-close").addEventListener("click", () => infoDialog.close());
      infoDialog.addEventListener("click", (e) => {
        if (e.target === infoDialog) infoDialog.close();
      });

      // ---- "Set values manually" window --------------------------------------
      const valuesDialog = $("values-dialog");
      const valuesHex = $("values-hex");
      const valuesColor = $("values-color");
      const valuesOpacity = $("values-opacity");
      const valuesError = $("values-error");
      let valuesId = null;

      function openValues(d) {
        const a = active[d.id];
        if (!a) return;
        valuesId = d.id;
        $("values-title").textContent = d.name_long;
        valuesHex.value = hexOf(a.color);
        valuesColor.value = hexOf(a.color);
        valuesOpacity.value = Math.round(a.opacity * 100);
        valuesError.textContent = "";
        valuesDialog.showModal();
      }

      valuesColor.addEventListener(
        "input",
        () => (valuesHex.value = valuesColor.value),
      );
      valuesHex.addEventListener("input", () => {
        if (/^#[0-9a-f]{6}$/i.test(valuesHex.value))
          valuesColor.value = valuesHex.value;
      });
      $("values-cancel").addEventListener("click", () => valuesDialog.close());
      $("values-apply").addEventListener("click", () => {
        let hex = valuesHex.value.trim();
        if (/^[0-9a-f]{6}$/i.test(hex)) hex = "#" + hex;
        const pct = Number(valuesOpacity.value);
        if (!/^#[0-9a-f]{6}$/i.test(hex)) {
          valuesError.textContent = "Color must look like #e6194b.";
          return;
        }
        if (valuesOpacity.value === "" || !(pct >= 0 && pct <= 100)) {
          valuesError.textContent = "Opacity must be a number from 0 to 100.";
          return;
        }
        setLayerStyle(valuesId, { color: hex, opacity: pct / 100 });
        refresh();
        valuesDialog.close();
      });

      // ---- 1. Countries -------------------------------------------------------
      async function loadCountries() {
        try {
          countries = await fetchCountries();
          fill(
            countrySel,
            countries.map((c) => ({ value: c.id, label: c.name })),
            "Select a country...",
          );
        } catch (e) {
          console.error(e);
          fill(countrySel, [], "Error");
          say("Could not load countries: " + e.message);
        }
      }

      countrySel.addEventListener("change", async () => {
        const token = ++selToken;
        resetLayers();
        clearDistrict();
        states = [];
        datasets = [];
        refresh();
        fill(stateSel, [], "Loading...");
        fill(districtSel, [], "Select a state first");

        const country = countries.find((c) => c.id === countrySel.value);
        if (!country) {
          fill(stateSel, [], "Select a country first");
          setTitle("");
          previewReset();
          say("");
          return;
        }

        setTitle(country.name);
        fitEnvelope(country.envelope);
        previewPlace(country.name, country.envelope);
        say(country.name + " selected");

        await loadStates(country.id);
        if (token !== selToken) return;

        if (states.length === 0) selectGeography(country, token);
      });

      // ---- 2. States ----------------------------------------------------------
      async function loadStates(countryId) {
        try {
          states = await fetchStates(countryId);
          fill(
            stateSel,
            states.map((s) => ({ value: s.id, label: s.name })),
            states.length ? "Select a state..." : "No sub-areas",
          );
        } catch (e) {
          console.error(e);
          states = [];
          fill(stateSel, [], "Error");
          say("Could not load states: " + e.message);
        }
      }

      stateSel.addEventListener("change", () => {
        const token = ++selToken;
        resetLayers();
        clearDistrict();
        datasets = [];
        refresh();

        const geo = states.find((s) => s.id === stateSel.value);
        if (!geo) {
          fill(districtSel, [], "Select a state first");
          const country = countries.find((c) => c.id === countrySel.value);
          if (country) previewPlace(country.name, country.envelope);
          say("");
          return;
        }

        setTitle(geo.name);
        fitEnvelope(geo.envelope);
        previewPlace(geo.name, geo.envelope);
        say(geo.name + " selected");
        selectGeography(geo, token);
      });

      // ---- 3. A geography is chosen -------------------------------------------
      async function selectGeography(geo, token) {
        fill(districtSel, [], "Loading...");
        datasetList.innerHTML = '<li class="empty">Loading layers...</li>';

        let list;
        try {
          list = await fetchDatasets(geo.id);
        } catch (e) {
          console.error(e);
          if (token !== selToken) return;
          say("Could not load datasets: " + e.message);
          datasetList.innerHTML =
            '<li class="empty">Could not load layers.</li>';
          fill(districtSel, [], "Error");
          return;
        }
        if (token !== selToken) return;
        datasets = list;
        refresh();

        loadOutline(datasets, token);
        loadDistricts(datasets, token);
      }

      async function loadOutline(list, token) {
        try {
          const gj = await fetchOutline(list);
          if (token !== selToken || !gj) return;
          previewOutline(gj);
        } catch (e) {
          console.warn("Outline not readable:", e);
        }
      }

      // ---- 4. Districts -------------------------------------------------------
      async function loadDistricts(list, token) {
        try {
          const result = await fetchDistricts(list);
          if (token !== selToken) return;

          if (!result) {
            fill(districtSel, [], "No district data");
            return;
          }
          districtFeatures = result.features;
          districtProp = result.prop;
          if (!districtProp) {
            fill(districtSel, [], "No district names found");
            return;
          }

          const names = [
            ...new Set(
              districtFeatures
                .map((f) => (f.properties || {})[districtProp])
                .filter(Boolean),
            ),
          ].sort();
          fill(
            districtSel,
            names.map((n) => ({ value: n, label: n })),
            "Select a district...",
          );
        } catch (e) {
          if (token !== selToken) return;
          console.warn("District file not readable:", e);
          fill(districtSel, [], "District list unavailable");
          say("Could not read district file (probably CORS): " + e.message);
        }
      }

      districtSel.addEventListener("change", () => {
        clearDistrictLayer();
        if (!districtSel.value || !districtProp) {
          setClip(null);
          previewDistrict(null);
          renderResults();
          say("");
          return;
        }
        const feats = districtFeatures.filter(
          (f) => (f.properties || {})[districtProp] === districtSel.value,
        );
        showDistrict(feats);
        setClip(feats);
        previewDistrict(feats, districtSel.value);
        renderResults();
        say("District: " + districtSel.value);
      });

      // ---- 5. Layers ----------------------------------------------------------
      async function toggleLayer(d, checkbox) {
        if (!checkbox.checked) {
          removeDataLayer(d.id);
          advOpen.delete(d.id);
          refresh();
          return;
        }
        if (active[d.id]) return;

        loadingIds.add(d.id);
        checkbox.closest(".ds").classList.add("loading");
        say("Loading " + d.name_long + "...");
        try {
          const gj = await fetchGeoJSON(d);
          const { shown, total } = addDataLayer(d.id, d.name_long, gj);
          say(
            d.name_long +
              ": " +
              (shown === total
                ? shown + " features"
                : shown + " of " + total + " features in " + districtSel.value),
          );
        } catch (e) {
          console.error(e);
          checkbox.checked = false;
          say(
            "Could not load " +
              d.name_long +
              ": " +
              e.message +
              " (check the Console for a CORS error)",
          );
        } finally {
          loadingIds.delete(d.id);
          refresh();
        }
      }

      // ---- 6. Rail, tabs, drawer, dialogs ------------------------------------
      document.querySelectorAll(".rail-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.cat === category);
        btn.addEventListener("click", () => {
          category = btn.dataset.cat;
          document
            .querySelectorAll(".rail-item")
            .forEach((b) => b.classList.toggle("active", b === btn));
          closeMenu();
          renderDatasets();
        });
      });

      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          tab = btn.dataset.tab;
          document
            .querySelectorAll(".tab")
            .forEach((b) => b.classList.toggle("active", b === btn));
          document.body.classList.toggle("show-results", tab === "analysis");
          renderResults();
          map.invalidateSize();
          previewResize();
        });
      });

      $("menu-btn").addEventListener("click", () =>
        side.classList.toggle("open"),
      );
      map.on("click", () => side.classList.remove("open"));

      const dialog = $("dialog");
      function openDialog(kind) {
        $("dialog-title").textContent = kind === "help" ? "Help" : "Disclaimer";
        $("dialog-text").textContent = TEXTS[kind];
        dialog.showModal();
      }
      $("help-btn").addEventListener("click", () => openDialog("help"));
      $("about-btn").addEventListener("click", () => openDialog("help"));
      $("disclaimer-btn").addEventListener("click", () =>
        openDialog("disclaimer"),
      );
      $("dialog-close").addEventListener("click", () => dialog.close());

      window.addEventListener("resize", previewResize);

      // ---- 7. URL state sync --------------------------------------------------
      [countrySel, stateSel, districtSel].forEach((s) =>
        s.addEventListener("change", syncUrl),
      );

      // ---- Crops (mock datasets) ----------------------------------------------
      // CHANGED: the crop logic is now a function so the URL restore can reuse it.
      const fakeCheckbox = () => ({
        checked: true,
        closest: () => ({ classList: { add() {} } }),
      });

      function applyCrop(currentCropId) {
        // Hide all crops first
        CROPS.forEach((c) => {
          const real = datasets.find((d) => d.name_long === c.dataset);
          const mockId = "mock_" + c.id;
          if (real && active[real.id]) {
            removeDataLayer(real.id);
          }
          if (active[mockId]) removeDataLayer(mockId);
        });

        if (currentCropId) {
          const selectedCrop = CROPS.find((c) => c.id === currentCropId);
          if (!selectedCrop) return refresh();
          let cropDataset = datasets.find(
            (d) => d.name_long === selectedCrop.dataset,
          );

          // Mock dataset: points to a local GeoJSON until the API has real crop data.
          if (!cropDataset) {
            cropDataset = {
              id: "mock_" + selectedCrop.id,
              name_long: selectedCrop.label + " Suitability",
              category: "demand",
              type: "polygons",
              source_files: [{ func: "vectors", endpoint: MOCK_CROP_FILE }],
            };
          }
          return toggleLayer(cropDataset, fakeCheckbox());
        }
        refresh();
      }

      if (cropSel && typeof CROPS !== "undefined") {
        fill(
          cropSel,
          CROPS.map((c) => ({ value: c.id, label: c.label })),
          "Select a crop",
        );
        cropSel.addEventListener("change", () => {
          applyCrop(cropSel.value);
          syncUrl();
        });
      }

      // ---- Restore from URL ---------------------------------------------------
      const waitFor = (test, ms = 20000) =>
        new Promise((resolve) => {
          const t0 = Date.now();
          (function tick() {
            if (test() || Date.now() - t0 > ms) return resolve(test());
            setTimeout(tick, 100);
          })();
        });

      const hasOption = (sel, v) => [...sel.options].some((o) => o.value === v);

      async function restoreFromUrl() {
        const cId = initialParams.get("country");
        const sId = initialParams.get("state");
        const dName = initialParams.get("district");
        const cropId = initialParams.get("crop"); // CHANGED
        const layerIds = (initialParams.get("layers") || "")
          .split(",")
          .filter(Boolean);

        try {
          if (!cId || !hasOption(countrySel, cId)) return;
          countrySel.value = cId;
          countrySel.dispatchEvent(new Event("change"));

          if (sId) {
            if (!(await waitFor(() => hasOption(stateSel, sId)))) return;
            stateSel.value = sId;
            stateSel.dispatchEvent(new Event("change"));
          }

          // District first, so the layers are clipped to it when they load.
          if (dName && (await waitFor(() => hasOption(districtSel, dName)))) {
            districtSel.value = dName;
            districtSel.dispatchEvent(new Event("change"));
          }

          if (layerIds.length) {
            await waitFor(() => datasets.length > 0);
            await Promise.all(
              layerIds.map((id) => {
                const d = datasets.find((x) => String(x.id) === id);
                return d && isDrawable(d) && !active[d.id]
                  ? toggleLayer(d, fakeCheckbox())
                  : null;
              }),
            );
          }

          // CHANGED: crop is applied last, after the area/district exist
          if (cropId && CROPS.some((c) => c.id === cropId)) {
            await waitFor(() => datasets.length > 0 || !stateSel.value);
            cropSel.value = cropId;
            await applyCrop(cropId);
          }
        } finally {
          restoring = false;
          syncUrl();
        }
      }

      refresh();
      loadCountries().then(restoreFromUrl);
    </script>
  </body>
</html>
