<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EAE map wrapper</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #bar {
        padding: 8px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        background: #f4f4f4;
        border-bottom: 1px solid #ddd;
      }
      label {
        display: flex;
        flex-direction: column;
        font-size: 12px;
        color: #444;
        gap: 2px;
      }
      select {
        min-width: 190px;
        max-width: 280px;
        padding: 4px;
        font-size: 14px;
      }
      #info {
        font-size: 12px;
        color: #555;
        flex-basis: 100%;
        min-height: 14px;
      }
      #wrap {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #layers {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        background: #fff;
        padding: 8px 10px;
        border-radius: 6px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        font-size: 13px;
        max-width: 280px;
        max-height: 60%;
        overflow: auto;
        display: none;
      }
      #layers h4 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      .sw {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid #333;
        flex: none;
      }
      .row span.t {
        flex: 1;
      }
      .row button {
        border: 0;
        background: none;
        cursor: pointer;
        font-size: 16px;
        color: #a00;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <label
        >Country
        <select id="country">
          <option value="">Loading...</option>
        </select>
      </label>
      <label
        >State
        <select id="state" disabled>
          <option value="">Select a country first</option>
        </select>
      </label>
      <label
        >District
        <select id="district" disabled>
          <option value="">Select a state first</option>
        </select>
      </label>
      <label
        >Add layer
        <select id="dataset" disabled>
          <option value="">Select a state first</option>
        </select>
      </label>
      <div id="info"></div>
    </div>

    <div id="wrap">
      <div id="map"></div>
      <div id="layers">
        <h4>Layers</h4>
        <div id="layerlist"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
      const API = "https://api.energyaccessexplorer.org";
      const DRAWABLE = ["points", "lines", "polygons", "polygons-boundaries"];
      const COLORS = [
        "#e6194b",
        "#3cb44b",
        "#4363d8",
        "#f58231",
        "#911eb4",
        "#008080",
        "#f032e6",
        "#9a6324",
        "#800000",
        "#000075",
      ];

      const countrySel = document.getElementById("country");
      const stateSel = document.getElementById("state");
      const districtSel = document.getElementById("district");
      const datasetSel = document.getElementById("dataset");
      const info = document.getElementById("info");
      const layersBox = document.getElementById("layers");
      const layerList = document.getElementById("layerlist");

      const say = (t) => (info.textContent = t);

      // ---- Map -----------------------------------------------------------
      // World view: the country is not known until the user picks one.
      const map = L.map("map", { preferCanvas: true }).setView([20, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      let countries = [];
      let states = [];
      let datasets = [];
      let districtFeatures = [];
      let districtProp = null; // name of the property that holds district names
      let districtLayer = null;
      const active = {}; // dataset id -> { layer, color, name }
      let colorIdx = 0;
      let selToken = 0; // ignores answers that arrive after the user changed their mind

      // ---- Helpers -------------------------------------------------------
      async function api(path, params) {
        const res = await fetch(API + path + "?" + new URLSearchParams(params));
        if (!res.ok) throw new Error("API " + res.status + " on " + path);
        return res.json();
      }

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function fill(select, items, placeholder) {
        select.innerHTML =
          '<option value="">' +
          esc(placeholder) +
          "</option>" +
          items
            .map(
              (i) =>
                '<option value="' +
                esc(i.value) +
                '"' +
                (i.disabled ? " disabled" : "") +
                ">" +
                esc(i.label) +
                "</option>",
            )
            .join("");
        select.disabled = items.length === 0;
      }

      function popupHtml(props) {
        const rows = Object.entries(props || {})
          .filter(([, v]) => v !== null && v !== "")
          .slice(0, 12)
          .map(
            ([k, v]) =>
              "<tr><td><b>" + esc(k) + "</b></td><td>" + esc(v) + "</td></tr>",
          )
          .join("");
        return rows
          ? '<table style="font-size:12px">' + rows + "</table>"
          : "No attributes";
      }

      function fitEnvelope(env) {
        // envelope = [minX, minY, maxX, maxY] -> Leaflet [[lat, lng], [lat, lng]]
        // Some geographies may have no envelope, so check before zooming.
        if (!Array.isArray(env) || env.length < 4) return;
        map.fitBounds([
          [env[1], env[0]],
          [env[3], env[2]],
        ]);
      }

      function hasVectorFile(d) {
        return (d.source_files || []).some((f) => f.func === "vectors");
      }

      // ---- 1. Countries (top of the tree: no parent) ---------------------
      async function loadCountries() {
        try {
          countries = await api("/geographies", {
            select: "id,name,adm,envelope,parent_id",
            parent_id: "is.null",
            order: "name.asc",
          });
          fill(
            countrySel,
            countries.map((c) => ({ value: c.id, label: c.name })),
            "Select a country...",
          );
        } catch (e) {
          console.error(e);
          say("Could not load countries: " + e.message);
        }
      }

      countrySel.addEventListener("change", async () => {
        const token = ++selToken;
        clearAllLayers();
        clearDistrict();
        states = [];
        datasets = [];
        fill(stateSel, [], "Loading...");
        fill(districtSel, [], "Select a state first");
        fill(datasetSel, [], "Select a state first");

        const country = countries.find((c) => c.id === countrySel.value);
        if (!country) {
          fill(stateSel, [], "Select a country first");
          say("");
          return;
        }

        fitEnvelope(country.envelope);
        say(country.name + " selected");

        await loadStates(country.id);
        if (token !== selToken) return;

        // A country without sub-areas: use the country itself.
        if (states.length === 0) selectGeography(country, token);
      });

      // ---- 2. States: children of the chosen country ---------------------
      async function loadStates(countryId) {
        try {
          states = await api("/geographies", {
            select: "id,name,adm,envelope,parent_id",
            parent_id: "eq." + countryId,
            order: "name.asc",
          });
          fill(
            stateSel,
            states.map((s) => ({ value: s.id, label: s.name })),
            states.length ? "Select a state..." : "No sub-areas",
          );
        } catch (e) {
          console.error(e);
          states = [];
          fill(stateSel, [], "Error");
          say("Could not load states: " + e.message);
        }
      }

      stateSel.addEventListener("change", () => {
        const token = ++selToken;
        clearAllLayers();
        clearDistrict();
        datasets = [];

        const geo = states.find((s) => s.id === stateSel.value);
        if (!geo) {
          fill(districtSel, [], "Select a state first");
          fill(datasetSel, [], "Select a state first");
          say("");
          return;
        }

        fitEnvelope(geo.envelope);
        say(geo.name + " selected");
        selectGeography(geo, token);
      });

      // ---- 3. A geography is chosen: load its datasets and districts -----
      async function selectGeography(geo, token) {
        fill(districtSel, [], "Loading...");
        fill(datasetSel, [], "Loading...");

        let list;
        try {
          list = await api("/datasets", {
            select: "id,name,name_long,type,source_files",
            geography_id: "eq." + geo.id,
            name_long: "not.is.null",
            order: "name_long.asc",
          });
        } catch (e) {
          console.error(e);
          if (token !== selToken) return;
          say("Could not load datasets: " + e.message);
          fill(datasetSel, [], "Error");
          fill(districtSel, [], "Error");
          return;
        }
        if (token !== selToken) return;
        datasets = list;

        fill(
          datasetSel,
          datasets.map((d) => {
            const ok = DRAWABLE.includes(d.type) && hasVectorFile(d);
            return {
              value: d.id,
              label:
                d.name_long + (ok ? "" : " (" + d.type + " - not drawable)"),
              disabled: !ok,
            };
          }),
          "Add a layer... (" + datasets.length + ")",
        );

        loadDistricts(datasets, token);
      }

      // ---- 4. Districts --------------------------------------------------
      // Dataset names and property names differ between countries and states,
      // so look for them with loose rules instead of one fixed name.
      function findDistrictDataset(list) {
        return (
          list.find((d) => d.name === "district-boundaries") ||
          list.find((d) => /district/i.test(d.name || "") && hasVectorFile(d))
        );
      }

      function detectNameProp(features) {
        const sample = (features.find((f) => f.properties) || {}).properties;
        const keys = Object.keys(sample || {});
        return (
          keys.find((k) => /^district(_?n(ame)?)?$/i.test(k)) ||
          keys.find((k) => /district/i.test(k)) ||
          keys.find((k) => /name/i.test(k)) ||
          null
        );
      }

      async function loadDistricts(list, token) {
        const dd = findDistrictDataset(list);
        const file =
          dd && (dd.source_files || []).find((f) => f.func === "vectors");
        if (!file) {
          fill(districtSel, [], "No district data");
          return;
        }
        try {
          const res = await fetch(file.endpoint);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const gj = await res.json();
          if (token !== selToken) return;

          districtFeatures = gj.features || [];
          districtProp = detectNameProp(districtFeatures);
          if (!districtProp) {
            fill(districtSel, [], "No district names found");
            return;
          }

          const names = [
            ...new Set(
              districtFeatures
                .map((f) => (f.properties || {})[districtProp])
                .filter(Boolean),
            ),
          ].sort();
          fill(
            districtSel,
            names.map((n) => ({ value: n, label: n })),
            "Select a district...",
          );
        } catch (e) {
          if (token !== selToken) return;
          console.warn("District file not readable:", e);
          fill(districtSel, [], "District list unavailable");
          say("Could not read district file (probably CORS): " + e.message);
        }
      }

      function clearDistrict() {
        if (districtLayer) {
          map.removeLayer(districtLayer);
          districtLayer = null;
        }
        districtFeatures = [];
        districtProp = null;
      }

      districtSel.addEventListener("change", () => {
        if (districtLayer) {
          map.removeLayer(districtLayer);
          districtLayer = null;
        }
        if (!districtSel.value || !districtProp) return;
        const feats = districtFeatures.filter(
          (f) => (f.properties || {})[districtProp] === districtSel.value,
        );
        districtLayer = L.geoJSON(
          { type: "FeatureCollection", features: feats },
          {
            style: {
              color: "#000",
              weight: 3,
              fillColor: "#ffd400",
              fillOpacity: 0.15,
            },
          },
        ).addTo(map);
        map.fitBounds(districtLayer.getBounds());
        say("District: " + districtSel.value);
      });

      // ---- 5. Layers -----------------------------------------------------
      datasetSel.addEventListener("change", async () => {
        const d = datasets.find((x) => x.id === datasetSel.value);
        datasetSel.value = "";
        if (!d) return;
        if (active[d.id]) {
          say(d.name_long + " is already on the map");
          return;
        }

        const file = d.source_files.find((f) => f.func === "vectors");
        say("Loading " + d.name_long + "...");
        try {
          const res = await fetch(file.endpoint);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const gj = await res.json();

          const color = COLORS[colorIdx++ % COLORS.length];
          const layer = L.geoJSON(gj, {
            pointToLayer: (f, latlng) =>
              L.circleMarker(latlng, {
                radius: 5,
                color: "#000",
                weight: 1,
                fillColor: color,
                fillOpacity: 0.9,
              }),
            style: () => ({
              color: color,
              weight: 2,
              fillColor: color,
              fillOpacity: 0.25,
            }),
            onEachFeature: (f, l) => l.bindPopup(popupHtml(f.properties)),
          }).addTo(map);

          active[d.id] = { layer, color, name: d.name_long };
          renderLayerList();
          say(
            d.name_long +
              ": " +
              (gj.features ? gj.features.length : 0) +
              " features",
          );
        } catch (e) {
          console.error(e);
          say(
            "Could not load " +
              d.name_long +
              ": " +
              e.message +
              " (check the Console for a CORS error)",
          );
        }
      });

      function renderLayerList() {
        const ids = Object.keys(active);
        layersBox.style.display = ids.length ? "block" : "none";
        layerList.innerHTML = "";
        ids.forEach((id) => {
          const a = active[id];
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML =
            '<div class="sw" style="background:' +
            a.color +
            '"></div>' +
            '<span class="t">' +
            esc(a.name) +
            "</span>" +
            '<button title="Remove">&times;</button>';
          row.querySelector("button").onclick = () => {
            map.removeLayer(a.layer);
            delete active[id];
            renderLayerList();
          };
          layerList.appendChild(row);
        });
      }

      function clearAllLayers() {
        Object.values(active).forEach((a) => map.removeLayer(a.layer));
        Object.keys(active).forEach((k) => delete active[k]);
        colorIdx = 0;
        renderLayerList();
      }

      loadCountries();
    </script>
  </body>
</html>
